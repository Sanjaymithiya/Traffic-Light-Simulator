<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traffic Light Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Traffic Light Simulator</h1>

    <main class="container">

        <div class="inner-container">

            <!-- Traffic Light -->
            <section class="main-box">

                <div class="box" id="red"></div>
                <div class="box" id="green"></div>
                <div class="box" id="yellow"></div>

            </section>


            <!-- Result / Video Section -->
            <section class="rules-book">

                <div class="video-container">

                    <video id="traffic-video" controls autoplay  playsinline>
                        <source src="./assets/Intro.mp4" type="video/mp4">
                        Your browser does not support the video element.
                    </video>

                </div>

                <div class="result">
                    <div class="color-circle">
                         <span class="circle"></span>
                         <h3 id="result-title">Select a Traffic Signal</h3>
                    </div>
                    <div class="title-info">
                    <p id="result-description">
                        Choose a signal below to see what it means.
                    </p>

                    </div>
                </div>

            </section>

        </div>


        <!-- Traffic Light Controls -->
        <div class="buttons">

            <button id="red-btn" type="button">Red</button>

            <button id="green-btn" type="button">Green</button>

            <button id="yellow-btn" type="button">Yellow</button>

        </div>

    </main>

    <footer>
        <h3>Web Development Project</h3>
    </footer>

    <script src="app.js"></script>

</body>

</html>
